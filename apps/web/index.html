<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="botd · 多节点个人智能体平台" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="botd" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>botd · 多节点个人智能体平台</title>
    <script>
      (function () {
        try {
          // 初始化可视高度，避免首屏渲染与软键盘弹起瞬间闪烁
          var syncHeight = function () {
            var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--app-height', h + 'px');
          };
          syncHeight();
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncHeight);
          }

          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var apply = function () {
            var stored = null;
            try { stored = localStorage.getItem('botd-theme'); } catch (e) {}
            var dark;
            if (stored === 'light' || stored === 'dark') {
              dark = stored === 'dark';
            } else {
              dark = mq.matches;
            }
            document.documentElement.classList.toggle('dark', dark);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', dark ? '#09090b' : '#ffffff');
          };
          apply();
          mq.addEventListener('change', apply);
        } catch (e) { /* noop */ }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-zinc-900 selection:text-white dark:selection:bg-zinc-100 dark:selection:text-zinc-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 过渡性清理（2024-11 加入）：历史版本注册过 sw.js（cache-first 导致前端更新不生效）。
      // 只满除本源注册的 SW 与 botd-* 缓存；若干个版本后可删除此即本。
      (function () {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (r) {
            if (r.scope && r.scope.startsWith(location.origin + '/')) r.unregister();
          });
        });
        if ('caches' in window) {
          caches.keys().then(function (names) {
            names.forEach(function (n) {
              if (n.indexOf('botd-') === 0) caches.delete(n);
            });
          });
        }
      })();
    </script>
  </body>
</html>
