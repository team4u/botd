# ==============================================================================
# botd GHCR 镜像部署（用户版，无需 clone 仓库）
#
# 用法：
#   1. 准备 .env 文件（或直接导出环境变量），至少配置 BOTD_ADMIN_PASSWORD：
#        echo 'BOTD_ADMIN_PASSWORD=your-password' > .env
#   2. 启动（固定版本建议显式指定 BOTD_VERSION，如 1.0.0）：
#        BOTD_VERSION=1.0.0 docker compose -f docker-compose.ghcr.yml up -d
#      或使用最新版：
#        docker compose -f docker-compose.ghcr.yml up -d
#
# .env 可放置 BOTD_ADMIN_PASSWORD、BOTD_HOST、BOTD_PORT 等变量，
# docker compose 会自动读取同目录下的 .env 文件做变量替换。
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Cloud Hub Service
  # Serves both the Hono backend API / WSS and Web SPA on port 3000
  # ----------------------------------------------------------------------------
  hub:
    image: ghcr.io/team4u/botd:${BOTD_VERSION:-latest}
    container_name: botd-hub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BOTD_HOST=0.0.0.0
      - BOTD_PORT=3000
      - BOTD_DB_PATH=/data/hub.sqlite
      # 管理员密码必填：留空时 hub 启动会生成一次性随机密码并打印到日志
      - BOTD_ADMIN_PASSWORD=${BOTD_ADMIN_PASSWORD:-}
    volumes:
      - hub-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: ["hub"]

  # ----------------------------------------------------------------------------
  # Optional Cloud Node Service (profile: cloud-node)
  # Co-located node daemon running with Pi SDK and independent data directory
  # ----------------------------------------------------------------------------
  cloud-node:
    image: ghcr.io/team4u/botd:${BOTD_VERSION:-latest}
    container_name: botd-cloud-node
    restart: unless-stopped
    profiles:
      - cloud-node
    environment:
      - BOTD_DATA_DIR=/data/node
    volumes:
      - node-data:/data/node
    depends_on:
      hub:
        condition: service_healthy
    command: ["start"]

volumes:
  # Persistent volume for Cloud Hub SQLite database and meta files
  hub-data:
    name: botd-hub-data

  # Persistent volume for Cloud Node configuration, skills, and bot workspaces
  node-data:
    name: botd-node-data
